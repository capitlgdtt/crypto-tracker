services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-tracker:local
    container_name: crypto-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_KEY: ${API_KEY}
      CMC_API_KEY: ${CMC_API_KEY}
      CMC_BASE_URL: ${CMC_BASE_URL:-https://pro-api.coinmarketcap.com}
      CMC_TIMEOUT_MS: ${CMC_TIMEOUT_MS:-10000}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-USD}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-60000}
      DB_PATH: /app/data/crypto.sqlite
    volumes:
      - crypto-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  crypto-data: